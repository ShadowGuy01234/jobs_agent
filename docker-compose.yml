services:
  outreach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_outreach_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite database and backups
      - ./data:/app/data
      # Hot-reloadable user profile and resume
      - ./user_profile.yaml:/app/user_profile.yaml:ro
      - ./profile:/app/profile:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
