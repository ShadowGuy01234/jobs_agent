[project]
name = "job_outreach"
version = "0.1.0"
description = "Personal AI Startup & Job Outreach System (Dual-Track + Stealth + Telegram Human-in-the-Loop)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "python-telegram-bot>=21.3",
    "apscheduler>=3.10.4",
    "psutil>=5.9.8",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
